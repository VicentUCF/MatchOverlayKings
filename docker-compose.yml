services:
  kpl-pilot:
    build:
      context: .
      args:
        MEDIAMTX_VERSION: "1.21.0"
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    image: kpl-live-pilot:1.21.0
    restart: unless-stopped
    init: true
    user: "${KPL_PILOT_UID:-1000}:${KPL_PILOT_GID:-1000}"
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - apps/web/.env
      - .env.pilot.docker
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      KPL_DATA_DIR: /app/data
      KPL_WEB_DIST: /app/apps/web/dist
      KPL_PILOT_FFMPEG_PATH: /usr/bin/ffmpeg
      KPL_PILOT_MEDIAMTX_PATH: /usr/local/bin/mediamtx
      KPL_PILOT_ADMIN_HOST: 172.30.0.1
    ports:
      - "4310:4310/tcp"
      - "8889:8889/tcp"
      - "8189:8189/udp"
    volumes:
      - ./data:/app/data
      # OAuth de YouTube: descomenta si vas a probar emisiones reales.
      # - ./secrets/client_secret.json:/run/secrets/youtube-client.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      default:
        ipv4_address: 172.30.0.2

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
